<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Calora — Build Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300..800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: #FBF7F0;
    font-family: "JetBrains Mono", "SF Mono", monospace;
    -webkit-font-smoothing: antialiased;
    cursor: none;
  }
  a { color: inherit; text-decoration: none; cursor: none; }

  .cursor-dot, .cursor-ring { position: fixed; top: 0; left: 0; pointer-events: none; z-index: 10000; }
  .cursor-dot { width: 4px; height: 4px; background: #2B2012; border-radius: 50%; transform: translate(-50%,-50%); }
  .cursor-ring { width: 28px; height: 28px; border: 1.5px solid rgba(43,32,18,0.35); border-radius: 50%; transform: translate(-50%,-50%); transition: width 220ms cubic-bezier(.2,.7,.3,1), height 220ms cubic-bezier(.2,.7,.3,1), border-radius 220ms; }
  body.cursor-hover .cursor-ring { width: 48px; height: 48px; border-radius: 4px; border-style: dashed; border-color: #2B2012; }

  .nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100; height: 52px;
    display: flex; align-items: center;
    padding: 0 32px;
    background: #FBF7F0;
    border-bottom: 1px solid rgba(43,32,18,0.08);
  }
  .nav-back {
    display: inline-flex; align-items: center; gap: 7px;
    font-family: "JetBrains Mono", monospace; font-size: 11px; font-weight: 500;
    letter-spacing: 0.1em; text-transform: uppercase;
    color: rgba(43,32,18,0.38); transition: color 160ms;
  }
  .nav-back:hover { color: #2B2012; }
  .nav-back svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: transform 200ms; }
  .nav-back:hover svg { transform: translateX(-3px); }

  iframe {
    position: fixed; top: 52px; left: 0; right: 0; bottom: 0;
    width: 100%; height: calc(100dvh - 52px);
    border: none;
  }
  @media (max-width: 640px) {
    .nav { height: 44px; }
    iframe { top: 44px; height: calc(100dvh - 44px); }
  }
</style>
</head>
<body>

<div class="cursor-dot" id="cursorDot"></div>
<div class="cursor-ring" id="cursorRing"></div>

<nav class="nav">
  <a class="nav-back" href="../build-lab.html">
    <svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    Build Lab
  </a>
</nav>

<iframe
  src="https://calora-ten.vercel.app"
  title="Calora — E-commerce with AI Recommendations"
  allow="fullscreen"
  loading="lazy"
></iframe>

<script>
  (function () {
    const dot = document.getElementById('cursorDot');
    const ring = document.getElementById('cursorRing');
    if (!dot || !ring) return;
    let mx = innerWidth/2, my = innerHeight/2, rx = mx, ry = my;
    addEventListener('mousemove', e => {
      mx = e.clientX; my = e.clientY;
      dot.style.transform = `translate(${mx}px,${my}px) translate(-50%,-50%)`;
    });
    (function tick() {
      rx += (mx-rx)*0.22; ry += (my-ry)*0.22;
      ring.style.transform = `translate(${rx}px,${ry}px) translate(-50%,-50%)`;
      requestAnimationFrame(tick);
    })();
    document.querySelectorAll('a').forEach(el => {
      el.addEventListener('mouseenter', () => document.body.classList.add('cursor-hover'));
      el.addEventListener('mouseleave', () => document.body.classList.remove('cursor-hover'));
    });
  })();
</script>

</body>
</html>
